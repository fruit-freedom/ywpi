server {
    # Correct MIME types for mjs bundles
    include mime.types;
    types {
        application/javascript js mjs;
    }

    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html = 404;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
