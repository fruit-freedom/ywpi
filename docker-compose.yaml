services:
  mongo:
    image: mongo:7.0.14-rc0-jammy
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    networks:
      - internal
    ports:
      - 27017:27017
    # volumes:
    #   - mongo-data:/data/db
  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      # UI with path prefix
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management path_prefix "/rabbitmq"'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.service=rabbitmq"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
      - "traefik.http.routers.rabbitmq.rule=PathPrefix(`/rabbitmq`)"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_traefik"
    networks:
      traefik:
      internal:
        aliases:
          - rabbitmq-internal
    # volumes:
    #   - rabbitmq-data:/var/lib/rabbitmq
    # ports:
    #   - 5672:5672
    #   - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
  hub:
    image: ywpi/hub
    restart: always
    build:
      context: packages/ywpi_hub
    environment:
      USE_RABBITMQ_EVENTS: 1
      RQ_HOST: rabbitmq-internal
    networks:
      - traefik
      - internal
    ports:
      - 50051:50051
  server:
    image: ywpi/server
    build:
      context: packages/server
    restart: always
    environment:
      RQ_HOST: rabbitmq-internal
      MONGO_CONNECTION_STRING: mongodb://mongo:mongo@mongo:27017/
      HUB_CONNECTION_STRING: hub:50051
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_traefik"
      - "traefik.http.services.server.loadbalancer.server.port=5011"
      - "traefik.http.routers.server.entrypoints=web"
      - "traefik.http.routers.server.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.server.service=server"
    networks: # Which network server used to connect to Rabbit MQ? Should use internal network
      - traefik
      - internal
    # ports:
    #   - 5011:5011
  web:
    image: ywpi/web
    build:
      context: web
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_traefik"
      - "traefik.http.services.web.loadbalancer.server.port=80"

      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.service=web"
    networks:
      - traefik
    # ports:
    #   - 80:80
  traefik:
    image: traefik:v3.4.1
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`traefik.docker.network`,`${COMPOSE_PROJECT_NAME}_traefik`)"
      - "--entrypoints.web.address=:80"
      - "--entryPoints.web.forwardedHeaders.insecure"
    networks:
      - traefik
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
networks:
  traefik:
  internal:
volumes:
  mongo-data:
